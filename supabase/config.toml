# Supabase CLI configuration (local development and function settings).
project_id = "storefront-workforce"

[functions.pin-login]
verify_jwt = false

[functions.kiosk-punch]
verify_jwt = true

[functions.staff-admin]
verify_jwt = true

# Authenticates managers itself, or a scheduled job by x-cron-secret.
[functions.event-sync]
verify_jwt = false

# Sends push and email for queued notifications; called by a scheduled job with x-cron-secret.
[functions.notify-dispatch]
verify_jwt = false
