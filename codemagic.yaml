# Codemagic builds for the iOS and Android apps. The web app is built and deployed by
# .github/workflows/deploy-web.yml, not here.
#
#   checks           pull requests: analyzer and tests only
#   android-release  a tag like v0.1.0: tests, then a signed app bundle (.aab)
#   ios-release      a tag like v0.1.0: tests, then a signed .ipa uploaded to TestFlight
#                    (internal testers; external testing is chosen in App Store Connect)
#
# Release with:  git tag v0.1.0 && git push origin v0.1.0
# or start any workflow by hand from the Codemagic dashboard.
#
# Every workflow runs on mac_mini_m2: the free personal plan includes 500 macOS minutes a
# month and no Linux machines (a linux_x2 build fails before it starts).
#
# One-time setup in Codemagic (Teams > your team):
#   Android  codemagic.yaml settings > Code signing identities > Android keystores:
#            upload the upload keystore with the reference name  storefront_upload_key
#   iOS      The App Store Connect API key is the existing  Venue Wrangler Wine  integration
#            (one key covers the whole Apple team). Code signing identities hold the
#            Apple Distribution certificate  storefront_distribution  (generated in
#            Codemagic, expires 2027/11/05) and the App Store profile  storefront_app_store
#            ("Storefront Workforce APNs" in the Apple portal, Push Notifications on).
#            They are named explicitly below so an older profile for the same bundle id
#            that has no matching certificate is never picked. When the certificate is
#            renewed, regenerate that profile with it and fetch it again.
#            The Apple team is at its limit of distribution certificates: making a new one
#            means revoking an old one first.
#
# The app's bundle id needs the Push Notifications capability turned on in the Apple
# Developer portal before that provisioning profile is created, or push will not work.
#
# The Supabase URL and publishable key below are public by design (they ship inside the
# app, as they do in the web build). Never put the service-role key here.
workflows:
  checks:
    name: Checks
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: 3.47.9
    triggering:
      events:
        - pull_request
    scripts:
      - name: Rules engine tests
        working_directory: packages/workforce_core
        script: |
          set -e
          dart pub get
          dart analyze
          dart test
      - name: App analysis and tests
        script: |
          set -e
          flutter pub get
          flutter analyze
          flutter test

  android-release:
    name: Android release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.47.9
      android_signing:
        - storefront_upload_key
      vars:
        SUPABASE_URL: https://dhmxrojpkjuhhmpqyljp.supabase.co
        SUPABASE_PUBLISHABLE_KEY: sb_publishable_WyKa6QIBvUpJ5dNPgQXt1Q_ZFMOdVB6
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    scripts:
      - name: Rules engine tests
        working_directory: packages/workforce_core
        script: |
          set -e
          dart pub get
          dart analyze
          dart test
      - name: App analysis and tests
        script: |
          set -e
          flutter pub get
          flutter analyze
          flutter test
      # Without a keystore Gradle falls back to debug signing, which Google Play rejects.
      - name: Require the upload keystore
        script: |
          if [ -z "$CM_KEYSTORE_PATH" ]; then
            echo "No keystore: add storefront_upload_key under Code signing identities."
            exit 1
          fi
      - name: Build app bundle
        script: |
          flutter build appbundle --release \
            --build-number=$BUILD_NUMBER \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt

  ios-release:
    name: iOS release
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: Venue Wrangler Wine
    environment:
      flutter: 3.47.9
      xcode: latest
      ios_signing:
        provisioning_profiles:
          - storefront_app_store
        certificates:
          - storefront_distribution
      vars:
        SUPABASE_URL: https://dhmxrojpkjuhhmpqyljp.supabase.co
        SUPABASE_PUBLISHABLE_KEY: sb_publishable_WyKa6QIBvUpJ5dNPgQXt1Q_ZFMOdVB6
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    scripts:
      - name: Rules engine tests
        working_directory: packages/workforce_core
        script: |
          set -e
          dart pub get
          dart analyze
          dart test
      - name: App analysis and tests
        script: |
          set -e
          flutter pub get
          flutter analyze
          flutter test
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      # Does nothing unless a plugin falls back to CocoaPods and Flutter wrote a Podfile.
      - name: Install pods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Build ipa
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Uploads go to TestFlight for internal testers. Submitting each build to external
        # beta review fails whenever an earlier build of the same version is still in
        # review, so choose which builds go to external testers in App Store Connect.
        submit_to_testflight: false
