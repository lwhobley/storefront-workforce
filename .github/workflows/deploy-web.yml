# Tests, builds the web app, and deploys it to Cloudflare on every push to main.
#
# One-time setup in GitHub (Settings > Secrets and variables > Actions > Secrets):
#   CLOUDFLARE_API_TOKEN   token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  Account ID from the Cloudflare dashboard
#
# The Supabase URL and publishable key below are public by design (they ship inside the
# web app). Never put the service-role key here.
name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

env:
  SUPABASE_URL: https://dhmxrojpkjuhhmpqyljp.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_WyKa6QIBvUpJ5dNPgQXt1Q_ZFMOdVB6

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Rules engine tests
        working-directory: packages/workforce_core
        run: dart pub get && dart analyze && dart test
      - name: App tests
        run: flutter pub get && flutter analyze && flutter test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Build web
        run: |
          flutter pub get
          flutter build web --release --no-web-resources-cdn \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
      - name: Check Cloudflare secrets
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
