name: storefront_workforce
description: Workforce management for arena concessions storefronts.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  workforce_core:
    path: packages/workforce_core
  flutter_riverpod: ^3.0.0
  go_router: ^18.0.2
  supabase_flutter: ^2.10.0
  intl: any
  shared_preferences: ^2.5.0
  image_picker: ^1.2.0
  geolocator: ^14.0.0
  timezone: ^0.11.2
  uuid: ^4.5.1
  web: ^1.1.1
  crypto: ^3.0.6
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo.jpg
    - assets/branding/intro.mp4
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans.ttf
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4-Regular.ttf
        - asset: assets/fonts/SourceSerif4-Semibold.ttf
          weight: 600

# App icons. The sources are the emblem from the logo (assets/branding/logo_original.jpg)
# without the wordmark, on the logo's navy. Regenerate after changing them with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/branding/icon.png
  android: true
  adaptive_icon_background: "#05162C"
  # The generator insets the foreground 16%, which keeps the emblem in the safe zone.
  adaptive_icon_foreground: assets/branding/icon.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/branding/icon.png
    background_color: "#05162C"
    theme_color: "#05162C"
